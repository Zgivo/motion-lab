name: Bootstrap repository

on:
  push:
    paths:
      - motion-lab-source.tar

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand source tree
        run: |
          tar -xf motion-lab-source.tar
          rm motion-lab-source.tar
          rm motion-lab-public.tar
          rm .github/workflows/bootstrap.yml
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Verify project
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build
      - name: Publish clean tree
        run: |
          git config user.name "Zgivo"
          git config user.email "198940968+Zgivo@users.noreply.github.com"
          git add -A
          git commit -m "Initial release: Motion Lab"
          git push
