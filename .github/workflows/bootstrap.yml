name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand initial source tree
        id: source
        run: |
          if [ -f motion-lab-public.tar ]; then
            tar -xf motion-lab-public.tar
            rm motion-lab-public.tar
            rm -f .github/workflows/ci.yml
            echo "expanded=true" >> "$GITHUB_OUTPUT"
          else
            echo "expanded=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Verify project
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build
      - name: Publish initial source tree
        if: steps.source.outputs.expanded == 'true'
        run: |
          git config user.name "Zgivo"
          git config user.email "198940968+Zgivo@users.noreply.github.com"
          git add -A
          git commit -m "Initial release: Motion Lab"
          git push
